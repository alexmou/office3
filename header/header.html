<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header</title>
  <link rel="stylesheet" href="./header.css">
</head>
<body>


<header class="app-header" id="appHeader">
  <div class="app-topbar">
    <div class="app-topbar-left">
      <button class="hamburger" type="button" aria-label="Open menu">&#9776;</button>
    </div>
    <div class="app-topbar-center">
      <div class="brand" aria-label="Button Rouge">Button Rouge</div>
    </div>
    <div class="app-topbar-right user-info">
      <span id="store"></span>
      <span id="username"></span>
      <button id="logoutButton" type="button">Logout</button>
    </div>
  </div>

  <div class="app-titlebar" aria-label="Page title">
    <h1 id="pageName"></h1>
  </div>

  <nav class="sidebar" id="sidebar" aria-label="Menu">
    <button class="closebtn" type="button" aria-label="Close menu">&times;</button>
    <ul id="hamburgerMenu"></ul>
  </nav>
</header>
<div id="errorPopup" class="error-popup hidden">
  <div class="error-popup-content">
    <span class="close-btn" onclick="hideErrorPopup()">&times;</span>
    <p id="errorMessage">Произошла ошибка. Пожалуйста, попробуйте снова.</p>
  </div>
</div>
<div id="informationalPopup" class="informational-popup hidden">
  <div class="informational-popup-content">
    <span class="close-btn" onclick="hideInformationalPopup()">&times;</span>
    <p id="informationalMessage"></p>
  </div>
</div>
