<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget</title>
  <link rel="stylesheet" href="./budget2.css">
</head>
<body>
<div id="global">
  <div id="main">
    <div id="myDiv" class="animate-bottom">
	       <button id="save-btn" disabled data-i18n="Сохранить изменения">Сохранить изменения</button>
      <div id="content" class="animate-bottom" style="display: inline-grid; max-width: 1600px;">
   
	          <nav id="summary" aria-label="Сводные данные по месяцам" data-i18n-attrs="aria-label:Сводные данные по месяцам" tabindex="0">

       

          </nav>


<div id="main-container" role="main">


	  <section id="right-container" aria-label="Управление статьями и детализация" data-i18n-attrs="aria-label:Управление статьями и детализация">
    <div id="articles-container">
      <div id="articles" aria-label="Список статей расходов и доходов">
        <h3>Статьи расходов / доходов</h3>
        <table>
          <thead>
            <tr><th>Статья</th><th>Факт</th><th>Прогноз</th></tr>
          </thead>
          <tbody id="articles-tbody"></tbody>
        </table>
        <button id="add-article-btn" title="Добавить статью" aria-label="Добавить статью">+</button>
      </div>


    </div>



      <div id="article-detail" aria-label="Детализация статьи" hidden>
        <h3>Детализация статьи</h3>
        <form id="article-form" onsubmit="return false;">
                 <span id="detail-article-name" style="font-weight:600;"></span>
          
          <label for="outcome-value">Расходы</label>
          <input type="text" id="outcome-value" step="100000" aria-describedby="fact-desc" style="    font-size: larger; color: crimson;"/>
          <span id="fact-desc" style="display:none">Значение расходов</span>
     
          <div class="checkbox-group">
            <input type="checkbox" id="paid-checkbox" />
            <label for="paid-checkbox" style="margin:0; user-select:none; cursor:pointer;">Оплачено</label>
          </div>
                          <p></p>
            <div id="commentField" contenteditable="true" style="border: 1px solid #ccc; min-height: 100px;">
        
            </div>
          
          <button type="button" id="close-detail">Закрыть</button>
        </form>
      </div>


<div id="pnlChartDiv1" class="chart-wrap">
          <canvas id="pnlChart1" >  </canvas>
    </div>


  </section>


</div>

<!-- Модальное окно для добавления статьи -->
<div id="modal-background" role="dialog" aria-modal="true" aria-labelledby="modal-label" tabindex="-1">
  <div id="modal-window">
    <label id="modal-label" for="modal-article-select">Выберите статью для добавления</label>
    <select id="modal-article-select" aria-required="true" ></select>
    <div>
      <button id="modal-add-btn" disabled>Добавить</button>
      <button id="modal-cancel-btn">Отмена</button>
    </div>
  </div>
</div>

            <div id="pnlchart2" height="600" width="800">
          <canvas id="pnlChart2" height="600"></canvas>
      </div>
  </div>
</div>
</div>



  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>
</div>

<script src="../vendor/chartjs-4.4.1.umd.min.js"></script>
  <script src="./budget2.js"></script>
</body>
</html>
