<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag print</title>
  <link rel="stylesheet" href="./barcode.css">
</head>
<body>
<div id="global">
  <div id="main">
    <div id="myDiv" class="animate-bottom" style="display: flex;">
      <div id="content-actions" style="display: flex;">
        <div id="content" class="animate-bottom" style="margin-right: 20px;">
        </div>
        <div id="actions" class="actions" style="margin-top: 23px;">
          <button id="edit" class="enabled-button" style="visibility: hidden;">Редактировать ценник</button>
          <button id="save" class="enabled-button" style="visibility: hidden;">Сохранить на будущее</button>
        </div>
      </div>
      <div id="products">
        <div id="edit-root" style="visibility:hidden"> </div>







      </div>
    </div>
    <div id="toastContainer"> </div>

  </div>
</div>


<style>


.barcode-box svg {
  width: 100%;
  height: 100%;
  display: block;
}

  .field-selected {
    outline: 1px solid var(--editor-accent);
    background-color:#708dc14a;
    cursor: nesw-resize;
  }

  .resize-handle {
      visibility:hidden;
    position: absolute;
    width: var(--handle-size);
    height: var(--handle-size);
    background: var(--editor-accent);
    border: 1px solid #fff;
    box-sizing: border-box;
    cursor: nwse-resize;
  }

  .resize-handle.ne {
      visibility:hidden;
    cursor: nesw-resize;
    top: -4px;
    right: -4px;
  }

  .resize-handle.nw {
      visibility:hidden;
    cursor: nwse-resize;
    top: -4px;
    left: -4px;
  }

  .resize-handle.se {
      visibility:hidden;
    cursor: nwse-resize;
    bottom: -4px;
    right: -4px;
  }

  .resize-handle.sw {
      visibility:hidden;
    cursor: nesw-resize;
    bottom: -4px;
    left: -4px;
  }

  /* Editor overlay */
  .label-editor-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .label-editor-dialog {
    max-width: calc(100% - 32px);
    max-height: calc(100% - 32px);
    width: 900px;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
    display: grid;
    grid-template-columns: 1fr var(--editor-panel-width);
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "title title"
      "canvas panel"
      "footer footer";
    height: -webkit-fill-available;
    margin: 10px;
  }

  .label-editor-title {
    grid-area: title;
    padding: 8px 12px;
    border-bottom: 1px solid #ddd;
    font-weight: bold;
  }

  .label-editor-canvas-wrapper {
    grid-area: canvas;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    background: var(--editor-bg);
    background-color: #adadad85;
  }

  .label-editor-panel {
    grid-area: panel;
    padding: 8px 12px;
    overflow-y: auto;
    border-left: 1px solid #ddd;
    font-size: 13px;
  }

  .label-editor-footer {
    grid-area: footer;
    padding: 8px 12px;
    border-top: 1px solid #ddd;
    text-align: right;
  }

  .label-editor-panel h3 {
    display:none;
    margin: 12px 0 4px;
    font-size: 13px;
  }

  .panel-field-list {
    display: none;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .panel-field-list li {
    
    margin: 0;
    padding: 4px 0;
    display: flex;
    align-items: center;
    gap: 4px;
    border-bottom: 1px solid #eee;
  }

  .panel-field-list li button {
    font-size: 11px;
    padding: 2px 4px;
  }

  .panel-field-list li span {
    flex: 1;
    cursor: pointer;
  }

  .panel-field-config label {
    display:none;
    display: block;
    margin-top: 6px;
  }

  .panel-field-config input[type="text"],
  .panel-field-config input[type="number"],
  .panel-field-config select,
  .panel-field-config textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 13px;
  }

  .panel-field-config textarea {
    min-height: 70px;
    font-family: monospace;
  }

  .small-note {
    font-size: 11px;
    color: #666;
  }

  /* Barcode placeholder */
  .barcode-box {
    position: absolute;
    display: flex;
    overflow: hidden;
  //  border: 1px dotted transparent;
    /* show when editing */
  }

  .barcode-box.edit-mode {
    border-color: var(--editor-accent);
    cursor: move;
  }

  .barcode-text {
    font-family: monospace;
    font-size: 10px;
  }

  /* Print button (outside of editor) */
  .print-btn {
    background: none;
    border: none;
    padding: 0;
  }

  .print-btn img {
    width: 16px;
    height: 16px;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.js"></script>
  <script src="https://cdn.bootcss.com/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  <script src="https://cdn.bootcss.com/FileSaver.js/2014-11-29/FileSaver.min.js"></script>
  <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./barcode.js"></script>
</body>
</html>
