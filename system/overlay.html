<div id="overlay">
<svg xmlns="http://www.w3.org/2000/svg"  id="loader" class="gear"  viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circle for button -->
  <circle cx="100" cy="100" r="90" fill="#cb1e32" stroke="darkred" stroke-width="4" />
    <!-- Inner glossy effect -->
  <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#cb1e32" stop-opacity="0"/>
  </radialGradient>
  <circle cx="100" cy="100" r="85" fill="url(#gloss)" />
    <!-- Holes in the button -->
   <circle cx="115" cy="85" r="12" fill="black" stroke="white" stroke-width="0"/>
  <circle cx="85" cy="115" r="12" fill="black" stroke="white" stroke-width="0"/>
  <!-- Shading to add 3D effect -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="black" stroke-opacity="0.2" stroke-width="6" />
</svg>

</div>
