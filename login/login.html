<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
</head>
<body>

<style>
  /* Основные стили для формы */
  .login-container {
    width: 300px;
    margin: 100px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #f9f9f9;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
  }

  .login-container h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .login-container input[type="text"],
  .login-container input[type="password"] {
    width: 91%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .login-container button {
    width: 100%;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }

  .login-container button:hover {
    background-color: #45a049;
  }

  .store-selector {
  padding-bottom: 14px;
  }

  .store-option {
    display: inline-block;
    width: 48%;
    margin-right: 2%;
    margin-top: 2%;
  }

  .store-option:last-child {
    margin-right: 0;
  }

  .store-btn {
    width: 100%;
    background-color: #f0f0f0;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
  }

  .store-btn.selected {
    background-color: #4CAF50;
    color: white;
    border-color: #45a049;
  }
</style>

      
    <div id="global" style="display: block;">

    <div id="myDiv" class="animate-bottom">
      <div id="content" class="animate-bottom">
        <div class="login-container">
                            <div id="errorPopup" class="error-popup hidden">
                    <div class="error-popup-content">
                      <span class="close-btn" onclick="hideErrorPopup()">&times;</span>
                      <p id="errorMessage" data-i18n="Произошла ошибка. Пожалуйста, попробуйте снова.">Произошла ошибка. Пожалуйста, попробуйте снова.</p>
                    </div>
                  </div>
          <h2>Login</h2>
            <a id="enter" style="display:none" href= ''>Enter</a>
<button id="enterBtn" type="button" style="display:none; margin-top:10px;">Enter</button>

          <form id="login-form">
            <input type="text" id="login" placeholder="Login" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <div class="store-selector" id="stores-container">

            </div>
            
            <button id="submitButton" type="submit">Authorize</button>
          </form>
        </div>
      </div>

      <div id="wrapper"></div>
    </div>
  </div>





</body>
</html>
